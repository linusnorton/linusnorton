name: board

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - src/**
      - config/**
      - .github/workflows/board.yml

permissions:
  contents: write

# A scheduled run and a push can overlap, and both push to master
concurrency:
  group: board
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run render
        env:
          RDM_API_KEY: ${{ secrets.RDM_API_KEY }}
      - name: Commit the board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "board unchanged"
          else
            git commit -m "Board at $(date -u +%H:%M)"
            git push
          fi
